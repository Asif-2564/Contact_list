{% extends 'contacts/base.html' %}

{% block content %}
    {% for contact in contacts %}
        <div class="container">
            <h1><b>{{ contact.author }}</b></h1>
            <h2><a href="{% url 'contact_detail' contact.pk %}">{{ contact.first_name }}</a></h1>
            <p>{{ contact.phone_number }}</p>
        </div>
    {% endfor %}
{% endblock content %}
